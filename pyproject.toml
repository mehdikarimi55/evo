[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-terrarium"
version = "0.9.0"
description = "A bounded runtime for safe evolutionary coding-agent experiments."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "EVO Project"}]
dependencies = ["cryptography>=44,<50"]

[project.scripts]
evo = "evo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evo = ["ui/static/*"]
